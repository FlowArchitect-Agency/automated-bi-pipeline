[project]
name = "bi-ai-pipeline"
version = "0.1.0"
description = "Automated BI Pipeline with AI Enrichment — Airflow-orchestrated, bilingual (FR/EN) data pipeline with AI-powered classification, summarization, anomaly detection and translation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
keywords = ["airflow", "etl", "llm", "rag", "bi", "data-engineering"]

# Runtime dependencies are pinned in requirements.txt for reproducible Docker builds.
dependencies = [
    "pandas>=2.2,<3",
    "psycopg2-binary>=2.9,<3",
    "SQLAlchemy>=2.0,<3",
    "weasyprint>=62,<63",
    "jinja2>=3.1,<4",
    "tenacity>=8.2,<9",
    "requests>=2.32,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<0.7",
    "mypy>=1.10,<2",
    "types-requests",
]
dashboard = [
    "streamlit>=1.36,<2",
    "plotly>=5.22,<6",
    "altair>=5.3,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

# ── Ruff ───────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["airflow/dags", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (common in Streamlit/Airflow)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # assert False in tests is fine

# ── Mypy ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
files = ["pipeline"]

[[tool.mypy.overrides]]
module = ["airflow.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: requires Docker/postgres services",
]
